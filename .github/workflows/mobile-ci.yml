name: VYRN Mobile CI

permissions:
  contents: write

# A push and its PR synchronize event represent the same work. Keep one
# validation run per branch/PR and cancel older revisions when a new commit lands.
concurrency:
  group: vyrn-mobile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  validate-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For PR builds validate and write lockfile changes on the actual
          # head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile and apply non-breaking security updates
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Install locked dependencies
        run: npm ci

      # Keep the safe audit remediations in the actual PR/main branch so
      # CI and release builds use the exact same locked dependency graph.
      - name: Save generated package lockfile
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add frontend/package-lock.json
          if ! git -C .. diff --cached --quiet; then
            target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git -C .. commit -m "chore: sync frontend dependency lockfile"
            git -C .. push origin "HEAD:refs/heads/${target_branch}"
          fi

      - name: Report all production dependency advisories
        run: npm audit --omit=dev || true

      # Safe, semver-compatible updates are applied above. High and critical
      # production dependency advisories remaining after those updates block CI.
      - name: Block high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript check
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform android --output-dir $RUNNER_TEMP/vyrn-android

      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform ios --output-dir $RUNNER_TEMP/vyrn-ios



  # Build a standalone release APK with its JavaScript bundle embedded,
  # then boot it and verify native 3D rendering and drag rotation on Android.
  build-android-native:
    name: Build and smoke-test standalone Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
      EXPO_PUBLIC_VYRN_3D_QA: '1'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For PR builds validate and write lockfile changes on the actual
          # head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies with non-breaking audit fixes
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile standalone Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK contains the embedded JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"
          echo "Standalone Android bundle is embedded in the release APK."

      - name: Launch app and verify 3D rendering and rotation on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio
          disable-animations: true
          script: |
            set -euo pipefail
            APK=frontend/android/app/build/outputs/apk/release/app-release.apk
            adb install -r "$APK"

            # Measure a cold activity launch without a development server.
            adb shell am force-stop com.vyrn.app
            launch_output="$(adb shell am start -W -n com.vyrn.app/.MainActivity)"
            printf '%s\n' "$launch_output"
            total_ms="$(printf '%s\n' "$launch_output" | awk -F': ' '/TotalTime/ {print $2}')"
            test -n "$total_ms"
            echo "Cold activity launch: ${total_ms}ms (budget: 10000ms)"
            test "$total_ms" -lt 10000

            # The QA route is unlocked only in this internal smoke-test build.
            adb shell am force-stop com.vyrn.app
            adb shell am start -W -a android.intent.action.VIEW -d "vyrn://qa/three-d" com.vyrn.app
            sleep 10
            adb shell uiautomator dump /sdcard/vyrn-ui.xml >/dev/null
            adb pull /sdcard/vyrn-ui.xml "$RUNNER_TEMP/vyrn-ui.xml"
            grep -q "3D_RENDER_READY" "$RUNNER_TEMP/vyrn-ui.xml"

            adb shell screencap -p /sdcard/vyrn-3d-before.png
            adb pull /sdcard/vyrn-3d-before.png "$RUNNER_TEMP/vyrn-3d-before.png"
            # Idle rotation is disabled here, so visible changes prove dragging.
            adb shell input swipe 260 850 820 850 600
            sleep 1
            adb shell screencap -p /sdcard/vyrn-3d-after.png
            adb pull /sdcard/vyrn-3d-after.png "$RUNNER_TEMP/vyrn-3d-after.png"

            python -m pip install --quiet pillow
            python - "$RUNNER_TEMP/vyrn-3d-before.png" "$RUNNER_TEMP/vyrn-3d-after.png" <<'PY'
            import sys
            from PIL import Image, ImageChops

            before = Image.open(sys.argv[1]).convert("RGB")
            after = Image.open(sys.argv[2]).convert("RGB")
            if before.size != after.size:
                raise SystemExit("Screenshot dimensions changed during the 3D interaction test")
            diff = ImageChops.difference(before, after).convert("L")
            changed_pixels = sum(1 for value in diff.getdata() if value > 18)
            print(f"3D drag changed {changed_pixels} pixels")
            if changed_pixels < 1000:
                raise SystemExit("3D model did not visibly respond to the horizontal drag")
            PY

            app_pid="$(adb shell pidof com.vyrn.app | tr -d '\r')"
            test -n "$app_pid"
            adb logcat -d --pid="$app_pid" > "$RUNNER_TEMP/vyrn-android-logcat.txt"
            if grep -E "FATAL EXCEPTION|Unable to load script|Could not load script|R3F muscle scene failed" "$RUNNER_TEMP/vyrn-android-logcat.txt"; then
              exit 1
            fi

      - name: Upload standalone APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyrn-android-standalone-smoke-test
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/vyrn-ui.xml
            ${{ runner.temp }}/vyrn-3d-before.png
            ${{ runner.temp }}/vyrn-3d-after.png
            ${{ runner.temp }}/vyrn-android-logcat.txt
          if-no-files-found: warn
          retention-days: 7

  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For PR builds validate and write lockfile changes on the actual
          # head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q .

      - name: Run backend smoke tests
        run: python -m pytest -q tests
