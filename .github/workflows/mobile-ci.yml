name: VYRN Mobile CI

permissions:
  contents: read

# A push and its PR synchronize event represent the same work. Keep one
# validation run per branch/PR and cancel older revisions when a new commit lands.
concurrency:
  group: vyrn-mobile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  validate-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For PR builds validate and write lockfile changes on the actual
          # head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install exactly what is committed. This keeps local, CI, and EAS
      # builds on one reproducible dependency graph.
      - name: Install locked dependencies
        run: npm ci

      # Expo SDK 54 currently has an unresolved transitive image-size advisory
      # in its Metro/build tooling. Report all findings, do not force a major
      # SDK migration during CI, and continue to fail on critical advisories.
      - name: Report production dependency advisories
        run: npm audit --omit=dev || true

      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript check
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform android --output-dir $RUNNER_TEMP/vyrn-android

      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform ios --output-dir $RUNNER_TEMP/vyrn-ios



  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For PR builds validate and write lockfile changes on the actual
          # head branch, not GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q .

      - name: Run backend smoke tests
        run: python -m pytest -q tests
