name: VYRN Mobile CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  validate-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile after declared dependency overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking security updates
        run: npm audit fix --ignore-scripts --no-fund

      # Commit the verified lockfile only from the feature-branch push run.
      # Pull-request CI checks the same updates in its ephemeral workspace.
      - name: Save security lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/reliability-and-home-workouts'
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add frontend/package-lock.json
          if ! git -C .. diff --cached --quiet; then
            git -C .. commit -m "chore: update vulnerable transitive npm dependencies"
            git -C .. push origin HEAD:refs/heads/fix/reliability-and-home-workouts
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: TypeScript check
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform android --output-dir $RUNNER_TEMP/vyrn-android

      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform ios --output-dir $RUNNER_TEMP/vyrn-ios


  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q .

      - name: Run backend smoke tests
        run: python -m pytest -q tests
