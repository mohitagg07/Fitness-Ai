name: VYRN Mobile CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "*.sql"
      - ".nvmrc"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  validate-expo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile after declared dependency overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci

      # Commit regenerated lockfiles on the working branch so npm ci is reproducible.
      # Pull-request CI checks the same updates in its ephemeral workspace.
      - name: Save generated package lockfile
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fix/') || startsWith(github.ref, 'refs/heads/feat/'))
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add frontend/package-lock.json
          if ! git -C .. diff --cached --quiet; then
            git -C .. commit -m "chore: sync frontend dependency lockfile"
            git -C .. push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi

      - name: Report all production dependency advisories
        run: npm audit --omit=dev || true

      # Expo SDK 54 still pulls a few upstream build-time advisories whose
      # safe resolution requires a major Expo upgrade or a not-yet-published
      # image-size fix. Do not force an SDK migration in this reliability PR.
      # Critical findings remain a hard failure.
      - name: Block critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript check
        run: npm run typecheck

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Bundle Android
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform android --output-dir $RUNNER_TEMP/vyrn-android

      - name: Bundle iOS
        env:
          EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
        run: npx expo export --platform ios --output-dir $RUNNER_TEMP/vyrn-ios



  # A Metro export cannot catch native Gradle / Android manifest / autolinking
  # failures. Compile a real debug APK so Android's native modules are checked.
  build-android-native:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://neurofit-ai-backend.onrender.com/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest image already includes Android command-line tools.
      # The older setup-android action currently asks sdkmanager for the removed
      # "tools" package, so use the runner's maintained SDK installation directly.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 16 build platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install locked dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile native Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vyrn-android-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q .

      - name: Run backend smoke tests
        run: python -m pytest -q tests
